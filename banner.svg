<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="100%" height="100%">
  <defs>
    <!-- Dark Navy Gradient Background -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814" />
      <stop offset="50%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <linearGradient id="text-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="line-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" stroke-opacity="0.3"/>
    </pattern>
  </defs>

  <!-- Background Layer -->
  <rect width="1200" height="350" fill="url(#bg-grad)" />
  <rect width="1200" height="350" fill="url(#grid)" />

  <!-- Abstract Geometric Accents (Cyan/Purple Glows) -->
  <circle cx="1100" cy="80" r="180" fill="#38bdf8" opacity="0.05" filter="blur(40px)" />
  <circle cx="1000" cy="280" r="160" fill="#a855f7" opacity="0.06" filter="blur(50px)" />

  <!-- Code / Terminal Window Mockup (Right Side) -->
  <g transform="translate(680, 55)">
    <!-- Terminal Outer Frame -->
    <rect width="470" height="240" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" opacity="0.9" />
    <!-- Terminal Header Buttons -->
    <circle cx="20" cy="18" r="5" fill="#ef4444" opacity="0.8" />
    <circle cx="36" cy="18" r="5" fill="#f59e0b" opacity="0.8" />
    <circle cx="52" cy="18" r="5" fill="#10b981" opacity="0.8" />
    <text x="75" y="22" fill="#64748b" font-family="monospace" font-size="11">developer.ts — Ronok Workspace</text>
    <line x1="0" y1="34" x2="470" y2="34" stroke="#1e293b" stroke-width="1" />

    <!-- Terminal Content (Syntax Highlighting) -->
    <g font-family="monospace" font-size="12" y="0">
      <text x="20" y="65" fill="#818cf8">const</text>
      <text x="65" y="65" fill="#38bdf8">developer</text>
      <text x="145" y="65" fill="#94a3b8">=</text>
      <text x="160" y="65" fill="#f43f5e">{</text>

      <text x="35" y="90" fill="#f1f5f9">name:</text>
      <text x="80" y="90" fill="#34d399">'Ronok Hallther'</text><text x="210" y="90" fill="#94a3b8">,</text>

      <text x="35" y="115" fill="#f1f5f9">role:</text>
      <text x="80" y="115" fill="#34d399">'Full Stack Developer'</text><text x="260" y="115" fill="#94a3b8">,</text>

      <text x="35" y="140" fill="#f1f5f9">stack:</text>
      <text x="90" y="140" fill="#94a3b8">[</text>
      <text x="100" y="140" fill="#38bdf8">'React'</text><text x="160" y="140" fill="#94a3b8">,</text>
      <text x="175" y="140" fill="#38bdf8">'Next.js'</text><text x="245" y="140" fill="#94a3b8">,</text>
      <text x="260" y="140" fill="#38bdf8">'Tailwind'</text>
      <text x="335" y="140" fill="#94a3b8">],</text>

      <text x="35" y="165" fill="#f1f5f9">languages:</text>
      <text x="120" y="165" fill="#94a3b8">[</text>
      <text x="130" y="165" fill="#c084fc">'TS'</text><text x="165" y="165" fill="#94a3b8">,</text>
      <text x="175" y="165" fill="#c084fc">'JS'</text><text x="210" y="165" fill="#94a3b8">,</text>
      <text x="220" y="165" fill="#c084fc">'Python'</text><text x="285" y="165" fill="#94a3b8">,</text>
      <text x="295" y="165" fill="#c084fc">'C++'</text><text x="335" y="165" fill="#94a3b8">,</text>
      <text x="345" y="165" fill="#c084fc">'SQL'</text>
      <text x="390" y="165" fill="#94a3b8">],</text>

      <text x="35" y="190" fill="#f1f5f9">status:</text>
      <text x="95" y="190" fill="#34d399">'Building scalable web apps'</text>

      <text x="20" y="215" fill="#f43f5e">};</text>
    </g>
  </g>

  <!-- Left Side: Main Typography -->
  <g transform="translate(70, 0)">
    <!-- Decorative Line Accent -->
    <rect x="0" y="115" width="4" height="110" fill="url(#text-grad)" rx="2" />

    <!-- Name Header -->
    <text x="24" y="150" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="800" font-size="44" fill="#f8fafc" letter-spacing="2">
      RONOK HALLTHER
    </text>

    <!-- Subtitle -->
    <text x="24" y="188" font-family="'Segoe UI', Roboto, Helvetica, sans-serif" font-weight="600" font-size="20" fill="url(#text-grad)" letter-spacing="1">
      Aspiring Full Stack Web Developer
    </text>

    <!-- Tech Stack Pill Tags -->
    <g transform="translate(24, 210)" font-family="sans-serif" font-size="11" font-weight="500">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="85" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" opacity="0.8"/>
      <text x="12" y="16" fill="#7dd3fc">JavaScript</text>

      <!-- Tag 2 -->
      <rect x="93" y="0" width="85" height="24" rx="12" fill="#1e293b" stroke="#38bdf8" stroke-width="0.8" opacity="0.8"/>
      <text x="105" y="16" fill="#7dd3fc">TypeScript</text>

      <!-- Tag 3 -->
      <rect x="186" y="0" width="60" height="24" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="0.8" opacity="0.8"/>
      <text x="198" y="16" fill="#a5b4fc">React</text>

      <!-- Tag 4 -->
      <rect x="254" y="0" width="70" height="24" rx="12" fill="#1e293b" stroke="#818cf8" stroke-width="0.8" opacity="0.8"/>
      <text x="266" y="16" fill="#a5b4fc">Next.js</text>

      <!-- Tag 5 -->
      <rect x="332" y="0" width="90" height="24" rx="12" fill="#1e293b" stroke="#c084fc" stroke-width="0.8" opacity="0.8"/>
      <text x="344" y="16" fill="#e9d5ff">Tailwind CSS</text>
    </g>
  </g>
</svg>
